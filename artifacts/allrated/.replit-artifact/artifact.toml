kind = "web"
previewPath = "/"
title = "Allrated"
version = "1.0.0"
id = "artifacts/allrated"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/allrated run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/allrated", "run", "build" ]
serve = "static"
publicDir = "artifacts/allrated/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
