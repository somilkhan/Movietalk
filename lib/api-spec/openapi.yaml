openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Movie/TV/anime catalog operations (proxied from TMDB)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /catalog/trending:
    get:
      operationId: getTrending
      tags: [catalog]
      summary: Trending titles
      parameters:
        - name: mediaType
          in: query
          required: false
          schema:
            type: string
            enum: [all, movie, tv]
            default: all
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [day, week]
            default: week
      responses:
        "200":
          description: Trending titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"

  /catalog/list:
    get:
      operationId: getCatalogList
      tags: [catalog]
      summary: Category list (popular, top rated, now playing, on the air, animation)
      parameters:
        - name: mediaType
          in: query
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [popular, top_rated, now_playing, on_the_air, animation]
      responses:
        "200":
          description: Titles in the category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"

  /catalog/anime:
    get:
      operationId: getAnime
      tags: [catalog]
      summary: Trending anime (Japanese-origin animation)
      responses:
        "200":
          description: Anime titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"

  /catalog/genres:
    get:
      operationId: getGenres
      tags: [catalog]
      summary: Genre list
      parameters:
        - name: mediaType
          in: query
          required: true
          schema:
            type: string
            enum: [movie, tv]
      responses:
        "200":
          description: Genres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreList"

  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      summary: Search movies, TV shows and people
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleList"

  /catalog/title/{mediaType}/{id}:
    get:
      operationId: getTitleDetail
      tags: [catalog]
      summary: Title detail (movie or TV show)
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Title detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
          enum: [ok, error]
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Title:
      type: object
      required:
        - id
        - mediaType
        - title
        - posterPath
        - backdropPath
        - overview
        - voteAverage
        - year
        - genreIds
      properties:
        id:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
        posterPath:
          type: ["string", "null"]
        backdropPath:
          type: ["string", "null"]
        overview:
          type: string
        voteAverage:
          type: number
        year:
          type: ["string", "null"]
        genreIds:
          type: array
          items:
            type: integer

    TitleList:
      type: array
      items:
        $ref: "#/components/schemas/Title"

    Genre:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    GenreList:
      type: array
      items:
        $ref: "#/components/schemas/Genre"

    TitleDetail:
      allOf:
        - $ref: "#/components/schemas/Title"
        - type: object
          required:
            - genres
            - runtimeMinutes
            - numberOfSeasons
          properties:
            genres:
              type: array
              items:
                $ref: "#/components/schemas/Genre"
            runtimeMinutes:
              type: ["integer", "null"]
            numberOfSeasons:
              type: ["integer", "null"]
